<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14181D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Home">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
<title>Home Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@4.30.0/lib/msal-browser.min.js"
        integrity="sha384-RGxxfG5yRS8DLU7ZJ8OoLhbV/BsJFHyPuMVHrTLbpj3t5Z15LnviJmaznKY/a7LZ"
        crossorigin="anonymous"></script>
<style>
  :root{
    --bg:#14181D; --panel:#1A1F26; --panel-raised:#20262E;
    --line:#2A3138; --line-soft:#232931;
    --text:#E8EAED; --text-dim:#8B94A0; --text-faint:#5B6470;
    --cal:#5b9be0; --act:#F5A623; --inv:#5FBF8F;
    --crit:#E5484D; --high:#F5A623; --med:#4C8BF5; --low:#6B7280;
    --overdue:#E5484D; --ok:#5FBF8F;
    --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
    --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  }
  *{box-sizing:border-box;}
  html,body{background:var(--bg);height:100%;}
  body{margin:0;color:var(--text);font-family:'IBM Plex Sans',-apple-system,sans-serif;
    font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;overflow:hidden;
    padding-left:var(--sal);padding-right:var(--sar);}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{-webkit-tap-highlight-color:transparent;font-family:inherit;}

  #menu{height:100vh;height:100dvh;display:flex;flex-direction:column;padding:calc(28px + var(--sat)) 36px calc(28px + var(--sab));}

  .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:28px;flex-wrap:wrap;}
  .clock{font-size:44px;font-weight:600;letter-spacing:-0.01em;}
  .dateline{color:var(--text-dim);font-size:17px;margin-top:2px;}
  .account{display:flex;align-items:center;gap:10px;color:var(--text-dim);font-size:13px;}
  .account button{background:none;border:1px solid var(--line);color:var(--text-dim);border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;}
  .account button:hover{border-color:var(--text-faint);color:var(--text);}
  .account button:focus-visible{outline:2px solid var(--cal);outline-offset:2px;}

  .summary{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:28px;}
  @media (max-width:760px){.summary{grid-template-columns:1fr;}}
  .scard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;min-height:96px;}
  .scard h2{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--text-dim);display:flex;align-items:center;gap:8px;}
  .roster-pill{font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--panel-raised);color:var(--text);}
  .sitem{display:flex;gap:10px;padding:5px 0;font-size:14.5px;align-items:baseline;}
  .sitem+.sitem{border-top:1px solid var(--line-soft);}
  .sitem .stime{color:var(--text-dim);font-size:12.5px;min-width:52px;flex:none;}
  .sitem .stitle{flex:1;}
  .smeta{margin-top:8px;font-size:12.5px;color:var(--text-dim);}
  .smeta b{color:var(--text);}
  .sempty{color:var(--text-faint);font-size:14px;padding:2px 0;}
  .sload{color:var(--text-faint);font-size:13px;}

  .tiles{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:20px;min-height:0;}
  @media (max-width:760px){.tiles{grid-template-columns:1fr;}}
  .tile{position:relative;border-radius:18px;border:1px solid var(--line);background:var(--panel);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    cursor:pointer;color:var(--text);padding:20px;}
  .tile:active{transform:scale(.98);}
  .tile:focus-visible{outline:3px solid var(--text);outline-offset:3px;}
  .tile .ic{width:64px;height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:30px;}
  .tile.cal .ic{background:rgba(91,155,224,.16);color:var(--cal);}
  .tile.act .ic{background:rgba(245,166,35,.16);color:var(--act);}
  .tile.inv .ic{background:rgba(95,191,143,.16);color:var(--inv);}
  .tile .lbl{font-size:19px;font-weight:600;}
  .tile .sub{font-size:13px;color:var(--text-dim);}
  .badge{position:absolute;top:16px;right:16px;background:var(--overdue);color:#fff;font-size:12px;font-weight:700;
    min-width:24px;height:24px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 6px;}

  .tile.calgroup{justify-content:flex-start;padding:18px;gap:12px;cursor:default;}
  .tile.calgroup:active{transform:none;}
  .calgroup .grouphead{display:flex;align-items:center;gap:10px;width:100%;}
  .calgroup .grouphead .ic{width:44px;height:44px;border-radius:12px;background:rgba(91,155,224,.16);color:var(--cal);
    display:flex;align-items:center;justify-content:center;font-size:22px;flex:none;}
  .calgroup .grouphead .lbl{font-size:17px;}
  .calgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;width:100%;flex:1;}
  .calbtn{position:relative;border-radius:12px;border:1px solid var(--line);background:var(--panel-raised);color:var(--text);
    display:flex;align-items:center;justify-content:center;padding:10px 6px;cursor:pointer;font-size:13px;font-weight:600;
    text-align:center;line-height:1.25;}
  .calbtn:active{transform:scale(.96);}
  .calbtn:focus-visible{outline:2px solid var(--cal);outline-offset:2px;}
  .calbtn:disabled{opacity:.4;cursor:not-allowed;}
  .calbtn .cbadge{position:absolute;top:4px;right:4px;background:var(--overdue);color:#fff;font-size:10px;font-weight:700;
    min-width:17px;height:17px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 4px;}
  .cal-owner{font-weight:400;color:var(--text-faint);font-size:12px;margin-left:2px;}

  #frame{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;}
  #frame.open{display:block;}
  #frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
  #backBtn{position:absolute;top:calc(10px + var(--sat));left:calc(10px + var(--sal));z-index:51;
    background:rgba(20,24,29,.88);backdrop-filter:blur(6px);border:1px solid var(--line);color:var(--text);
    border-radius:12px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;}
  #backBtn:active{transform:scale(.97);}

  .gate{position:fixed;inset:0;background:rgba(10,12,15,.7);display:none;align-items:center;justify-content:center;z-index:60;padding:20px;}
  .gate.open{display:flex;}
  .gatebox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px;max-width:380px;text-align:center;}
  .gatebox h2{margin:0 0 8px;font-size:19px;}
  .gatebox p{color:var(--text-dim);font-size:14px;margin:0 0 18px;}
  .gatebox button{background:var(--cal);color:#0c1116;border:0;border-radius:10px;padding:11px 22px;font-size:14.5px;font-weight:600;cursor:pointer;}
</style>
</head>
<body>

<div id="menu">
  <div class="topbar">
    <div>
      <div class="clock" id="clock">--:--</div>
      <div class="dateline" id="dateline">—</div>
    </div>
    <div class="account">
      <span id="acctText">Not signed in</span>
      <button id="acctBtn">Sign in</button>
    </div>
  </div>

  <div class="summary">
    <div class="scard">
      <h2>Today <span class="cal-owner">Marc's calendar</span> <span id="todayPill"></span></h2>
      <div id="todayBody"><div class="sload">Loading…</div></div>
    </div>
    <div class="scard">
      <h2>Tomorrow <span class="cal-owner">Marc's calendar</span> <span id="tomPill"></span></h2>
      <div id="tomBody"><div class="sload">Loading…</div></div>
    </div>
  </div>

  <div class="tiles">
    <div class="tile calgroup">
      <div class="grouphead">
        <span class="ic">📅</span>
        <span class="lbl">Calendar</span>
      </div>
      <div class="calgrid" id="calGrid"></div>
    </div>
    <button class="tile act" data-app="act">
      <span class="badge" id="actBadge" hidden>0</span>
      <span class="ic">✅</span>
      <span class="lbl">Actions</span>
      <span class="sub">Open actions & due dates</span>
    </button>
    <button class="tile inv" data-app="inv">
      <span class="ic">📦</span>
      <span class="lbl">Inventory</span>
      <span class="sub">Find where things are stored</span>
    </button>
  </div>
</div>

<div id="frame">
  <button id="backBtn">‹ Menu</button>
  <iframe id="ifr" title="App view"></iframe>
</div>

<div class="gate" id="gate">
  <div class="gatebox">
    <h2 id="gateTitle">Sign in</h2>
    <p id="gateText"></p>
    <button id="gateBtn" style="display:none;"></button>
  </div>
</div>

<script>
/* =====================================================================
   CONFIG
   ===================================================================== */
const CONFIG = { clientId: 'b70a3353-e5c3-4d93-9614-94484692d051' };
const APPS = {
  act: { url: 'https://mkirsten583.github.io/action-tracker/' },
  inv: { url: 'https://mkirsten583.github.io/inventory-locator/' },
};
// Six calendar buttons, future-proofed for separate calendars later.
// Only entries with a url are clickable; the rest show as "Coming soon".
const CALENDARS = [
  { key: 'family', label: 'Main Family Calendar', url: '' },
  { key: 'marc',   label: 'Marc',                 url: 'https://mkirsten583.github.io/home-calendar/' },
  { key: 'nicole', label: 'Nicole',                url: '' },
  { key: 'macsen', label: 'Macsen',                url: '' },
  { key: 'colton', label: 'Colton',                url: '' },
  { key: 'pets',   label: 'Pets',                  url: '' },
];
const ONEDRIVE_CALENDAR_PATH = 'marc.kirsten/Browser Tools/Calendar/calendar-data.json';
const ONEDRIVE_ACTIONS_PATH  = 'marc.kirsten/Browser Tools/Action Tracking/action-tracker-data.json';
/* ===================================================================== */

const SCOPES = ['User.Read', 'Files.Read'];
const GRAPH = 'https://graph.microsoft.com/v1.0';
let msalApp = null, account = null;

const $ = id => document.getElementById(id);

/* ---------------- Auth (MSAL) ---------------- */
function redirectUri(){ return location.origin + location.pathname.replace(/index\.html$/, ''); }

async function initAuth(){
  if(!window.msal) throw new Error('Microsoft sign-in library did not load.');
  msalApp = new msal.PublicClientApplication({
    auth: {
      clientId: CONFIG.clientId,
      authority: 'https://login.microsoftonline.com/consumers',
      redirectUri: redirectUri(),
      postLogoutRedirectUri: redirectUri(),
    },
    cache: { cacheLocation: 'localStorage' },
  });
  await msalApp.initialize();
  const resp = await msalApp.handleRedirectPromise();
  if(resp && resp.account) msalApp.setActiveAccount(resp.account);
  account = msalApp.getActiveAccount() || msalApp.getAllAccounts()[0] || null;
  if(account) msalApp.setActiveAccount(account);
}
function signIn(){ msalApp.loginRedirect({ scopes: SCOPES, prompt: 'select_account' }); }
async function signOut(){ await msalApp.logoutRedirect({ account }); }

async function getToken(){
  if(!account) throw new Error('Not signed in');
  try{
    const r = await msalApp.acquireTokenSilent({ scopes: SCOPES, account });
    return r.accessToken;
  }catch(e){
    const code = (e && (e.errorCode || e.name)) || '';
    if(e instanceof msal.InteractionRequiredAuthError || /interaction_required|login_required|consent_required|no_tokens_found|monitor_window_timeout/.test(code)){
      await msalApp.acquireTokenRedirect({ scopes: SCOPES, account });
      return new Promise(() => {});
    }
    throw e;
  }
}

/* ---------------- Microsoft Graph ---------------- */
async function graphGetJson(path){
  const token = await getToken();
  const url = GRAPH + '/me/drive/root:/' + path.split('/').map(encodeURIComponent).join('/') + ':/content';
  const r = await fetch(url, { headers: { Authorization: 'Bearer ' + token }, cache: 'no-store' });
  if(r.status === 404) return null;
  if(!r.ok) throw new Error('Graph error ' + r.status);
  const text = await r.text();
  if(!text.trim()) return null;
  return JSON.parse(text);
}

/* ---------------- Date helpers ---------------- */
const pad = n => String(n).padStart(2, '0');
const fmtDate = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
const toStr = dt => fmtDate(dt.getFullYear(), dt.getMonth() + 1, dt.getDate());
const parseYMD = s => { const [y, m, d] = s.split('-').map(Number); return { y, m, d }; };
const dayNum = s => { const { y, m, d } = parseYMD(s); return Math.round(Date.UTC(y, m - 1, d) / 86400000); };
const weekday = s => (new Date(dayNum(s) * 86400000).getUTCDay() + 6) % 7;
const daysInMonth = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();
const todayStr = () => toStr(new Date());
const addDaysStr = (iso, n) => { const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return toStr(d); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------------- Calendar recurrence (mirrors home-calendar) ---------------- */
function occursOn(it, ds){
  const start = it.date; if(!start) return false;
  const r = it.repeat || 'none', dn = dayNum(ds), sn = dayNum(start);
  if(dn < sn) return false;
  if(it.skip && it.skip.includes(ds)) return false;
  if(r === 'none'){ const end = it.endDate ? dayNum(it.endDate) : sn; return dn <= Math.max(end, sn); }
  if(it.until && dn > dayNum(it.until)) return false;
  const n = Math.max(1, +it.interval || 1);
  if(r === 'day') return (dn - sn) % n === 0;
  if(r === 'week'){
    const days = it.weekdays && it.weekdays.length ? it.weekdays : [weekday(start)];
    if(!days.includes(weekday(ds))) return false;
    const wk = ((dn - weekday(ds)) - (sn - weekday(start))) / 7;
    return wk % n === 0;
  }
  const a = parseYMD(start), b = parseYMD(ds);
  if(r === 'month'){ const months = (b.y - a.y) * 12 + (b.m - a.m); if(months < 0 || months % n) return false; return b.d === Math.min(a.d, daysInMonth(b.y, b.m)); }
  if(r === 'year'){ if((b.y - a.y) % n || a.m !== b.m) return false; return b.d === Math.min(a.d, daysInMonth(b.y, b.m)); }
  return false;
}
function itemsForDay(items, ds){
  const out = [];
  for(const it of items){
    if(it.type === 'travel'){
      const dd = it.departDate, ad = it.arriveDate || it.departDate; if(!dd) continue;
      if(ds === dd) out.push({ it, time: it.departTime || '', tag: ds === ad ? '' : 'Depart' });
      else if(ds === ad) out.push({ it, time: it.arriveTime || '', tag: 'Arrive' });
      else if(dayNum(ds) > dayNum(dd) && dayNum(ds) < dayNum(ad)) out.push({ it, time: '', tag: 'Away' });
    } else if(it.type === 'stay'){
      const ci = it.checkInDate, co = it.checkOutDate || it.checkInDate; if(!ci) continue;
      if(ds === ci) out.push({ it, time: it.checkInTime || '', tag: ds === co ? '' : 'Check in' });
      else if(ds === co) out.push({ it, time: it.checkOutTime || '', tag: 'Check out' });
      else if(dayNum(ds) > dayNum(ci) && dayNum(ds) < dayNum(co)) out.push({ it, time: '', tag: '' });
    } else if(occursOn(it, ds)){
      out.push({ it, time: it.startTime || '', tag: '' });
    }
  }
  out.sort((a, b) => (a.time || '').localeCompare(b.time || ''));
  return out;
}
const TYPE_ICON = { special: '🎉', holiday: '🌴', travel: '✈️', stay: '🛏️', appt: '🕒', work: '💼', chore: '✅', other: '📌' };
const DTLABEL = { holiday: 'Public holiday', onsite: 'On site', offsite: 'Offsite', annual: 'Annual leave', sick: 'Sick leave', rdo: 'RDO' };

function renderDaySummary(bodyEl, pillEl, ds, calData, actions){
  pillEl.innerHTML = '';
  const dt = calData && calData.dayTypes ? calData.dayTypes[ds] : null;
  if(dt && DTLABEL[dt]) pillEl.innerHTML = `<span class="roster-pill">${esc(DTLABEL[dt])}</span>`;

  let html = '';
  if(calData){
    const rows = itemsForDay(calData.items || [], ds).slice(0, 5);
    if(rows.length){
      html += rows.map(r => `<div class="sitem"><span class="stime mono">${esc(r.time || '')}</span><span class="stitle">${TYPE_ICON[r.it.type] || '📌'} ${esc(r.it.title || '')}${r.tag ? ' · ' + esc(r.tag) : ''}</span></div>`).join('');
    } else {
      html += `<div class="sempty">Nothing on the calendar.</div>`;
    }
  } else {
    html += `<div class="sload">Sign in to load the calendar.</div>`;
  }

  if(actions){
    const due = actions.filter(a => a.due === ds);
    if(due.length) html += `<div class="smeta"><b>${due.length}</b> action${due.length === 1 ? '' : 's'} due</div>`;
  }
  bodyEl.innerHTML = html;
}

/* ---------------- Load & render ---------------- */
async function loadSummary(){
  const today = todayStr(), tomorrow = addDaysStr(today, 1);
  let calData = null, actions = null;

  try{ calData = await graphGetJson(ONEDRIVE_CALENDAR_PATH); }catch(e){ /* leave null */ }
  try{
    const raw = await graphGetJson(ONEDRIVE_ACTIONS_PATH);
    if(raw){
      const list = Array.isArray(raw) ? raw : (raw.actions || []);
      actions = list.filter(a => a.status !== 'Closed').map(a => ({ due: a.dueDate, priority: a.priority, description: a.description }));
    }
  }catch(e){ /* leave null */ }

  renderDaySummary($('todayBody'), $('todayPill'), today, calData, actions);
  renderDaySummary($('tomBody'), $('tomPill'), tomorrow, calData, actions);

  if(actions){
    const dueToday = actions.filter(a => a.due === today || (a.due && a.due < today)).length;
    $('actBadge').hidden = !dueToday;
    $('actBadge').textContent = dueToday;
  }
  if(calData){
    const soon = itemsForDay(calData.items || [], today).length;
    const b = document.querySelector('.calbtn[data-cal="marc"] .cbadge');
    if(b){ b.hidden = !soon; b.textContent = soon; }
  }
}

/* ---------------- Calendar mini-buttons ---------------- */
function renderCalGrid(){
  const grid = $('calGrid');
  grid.innerHTML = CALENDARS.map(c => `
    <button class="calbtn" data-cal="${c.key}" ${c.url ? '' : 'disabled'}>
      ${c.url ? `<span class="cbadge" hidden>0</span>` : ''}
      ${esc(c.label)}${c.url ? '' : '<br><span style="font-weight:400;color:var(--text-faint);font-size:10.5px;">Coming soon</span>'}
    </button>`).join('');
  grid.querySelectorAll('.calbtn[data-cal]:not(:disabled)').forEach(btn => {
    btn.addEventListener('click', () => {
      const cal = CALENDARS.find(c => c.key === btn.dataset.cal);
      openApp(btn.dataset.cal, cal.url);
    });
  });
}

function tick(){
  const now = new Date();
  $('clock').textContent = now.toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit' });
  $('dateline').textContent = now.toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long' });
}

function renderAccount(){
  if(account){
    $('acctText').textContent = account.name || account.username || 'Signed in';
    $('acctBtn').textContent = 'Sign out';
    $('acctBtn').onclick = signOut;
  } else {
    $('acctText').textContent = 'Not signed in';
    $('acctBtn').textContent = 'Sign in';
    $('acctBtn').onclick = signIn;
  }
}

/* ---------------- Tiles / fullscreen frame ---------------- */
function openApp(key, url){
  const ifr = $('ifr');
  if(ifr.dataset.app !== key){ ifr.src = url; ifr.dataset.app = key; }
  $('frame').classList.add('open');
}
document.querySelectorAll('.tile[data-app]').forEach(t => {
  t.addEventListener('click', () => openApp(t.dataset.app, APPS[t.dataset.app].url));
});
$('backBtn').addEventListener('click', () => $('frame').classList.remove('open'));

/* ---------------- Boot ---------------- */
function showGate(title, text, btnLabel, onClick){
  $('gateTitle').textContent = title;
  $('gateText').textContent = text;
  const b = $('gateBtn');
  if(btnLabel){ b.textContent = btnLabel; b.style.display = 'inline-block'; b.onclick = onClick; }
  else b.style.display = 'none';
  $('gate').classList.add('open');
}
function hideGate(){ $('gate').classList.remove('open'); }

(async function boot(){
  tick(); setInterval(tick, 15000);
  renderCalGrid();

  if(!CONFIG.clientId || CONFIG.clientId.startsWith('PASTE')){
    showGate('One setup step left', 'Paste your Application (client) ID into CONFIG near the top of the script.');
    return;
  }
  try{
    await initAuth();
  }catch(e){
    showGate('Could not start sign-in', e.message);
    return;
  }
  renderAccount();
  if(account){
    hideGate();
    loadSummary();
  } else {
    $('todayBody').innerHTML = '<div class="sload">Sign in to load the calendar & actions.</div>';
    $('tomBody').innerHTML = '<div class="sload">Sign in to load the calendar & actions.</div>';
  }
})();
</script>
</body>
</html>
