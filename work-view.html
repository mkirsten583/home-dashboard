<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work - Shift Report</title>
<style>
:root{
  --u:min(1vw,1.6vh);
  --bg:#12161b; --panel:#1a2027; --line:#2b343d; --head:#222b34;
  --txt:#e8edf2; --mut:#9fb0c0; --dim:#6b7885;
  --neg:#ff9b73; --pos:#6fd3a0; --acc:#5aa9e6; --chip:#2a3f57; --warn:#f2c14e;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
  font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{height:100vh;display:flex;flex-direction:column}

header{display:flex;justify-content:space-between;align-items:center;
  padding:calc(var(--u)*1.2) calc(var(--u)*2.8);background:var(--panel);border-bottom:1px solid var(--line)}
.kicker{font-size:calc(var(--u)*2.2);font-weight:600}
.sub{font-size:calc(var(--u)*1.5);color:var(--mut);margin-top:calc(var(--u)*.3)}
.chip{padding:calc(var(--u)*.6) calc(var(--u)*1.6);border-radius:999px;background:var(--chip);
  color:#cfe3f7;font-size:calc(var(--u)*1.7);font-weight:600}

#bar{height:calc(var(--u)*.5);background:var(--line)}
#bar i{display:block;height:100%;width:0;background:var(--acc)}
#bar.run i{animation:fill var(--dur,10s) linear forwards}
@keyframes fill{from{width:0}to{width:100%}}

#stage{flex:1;min-height:0;padding:calc(var(--u)*2) calc(var(--u)*2.8);display:flex;flex-direction:column}
#stage.in{animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(calc(var(--u)*.8))}to{opacity:1;transform:none}}
h1{margin:0 0 calc(var(--u)*1.2);font-size:calc(var(--u)*3);font-weight:600}

.card{background:var(--panel);border:1px solid var(--line);border-radius:calc(var(--u)*1.2);overflow:hidden}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:calc(var(--u)*2.4)}
th{background:var(--head);color:var(--mut);font-size:calc(var(--u)*1.5);font-weight:600;
  text-transform:uppercase;letter-spacing:.06em;text-align:right;padding:calc(var(--u)*1.1) calc(var(--u)*1.6)}
td{text-align:right;padding:0 calc(var(--u)*1.6);border-top:1px solid var(--line);height:var(--rowh,auto)}
th:first-child,td:first-child,.l{text-align:left}
td:first-child{font-weight:600}
.neg{color:var(--neg);font-weight:600}
.pos{color:var(--pos);font-weight:600}
.v0,.dim{color:var(--dim)}
tr.nodata td{color:#5d6a77}
.pc{white-space:nowrap}
.meter{display:inline-block;width:calc(var(--u)*10);height:calc(var(--u)*1);background:var(--line);
  border-radius:999px;overflow:hidden;vertical-align:middle;margin-right:calc(var(--u)*1)}
.meter i{display:block;height:100%;background:var(--acc)}
.pcv{display:inline-block;min-width:3.2em;text-align:right}

.notice{padding:calc(var(--u)*3);font-size:calc(var(--u)*2)}
.notice h2{margin:0 0 calc(var(--u)*1);font-size:calc(var(--u)*2.6)}
.notice p{margin:0 0 calc(var(--u)*1.2);color:var(--mut)}
pre{background:var(--bg);border:1px solid var(--line);border-radius:calc(var(--u)*.8);
  padding:calc(var(--u)*1.2);font-size:calc(var(--u)*1.5);color:#cfe3f7;overflow:auto;margin:0}
button.act{font:inherit;font-size:calc(var(--u)*2);padding:calc(var(--u)*1.2) calc(var(--u)*3);
  min-height:44px;border-radius:calc(var(--u)*1);border:1px solid #3a4651;background:var(--chip);color:#fff;cursor:pointer}

footer{display:flex;justify-content:space-between;align-items:center;
  padding:0 calc(var(--u)*2.8);min-height:calc(var(--u)*4);background:var(--panel);border-top:1px solid var(--line);
  font-size:calc(var(--u)*1.4);color:var(--mut)}
.warn{color:var(--warn)}
#dots{display:flex}
.dot{width:44px;height:44px;border:0;background:none;cursor:pointer;display:grid;place-items:center;padding:0}
.dot::after{content:"";width:calc(var(--u)*1.1);height:calc(var(--u)*1.1);min-width:10px;min-height:10px;
  border-radius:50%;background:#3a4651}
.dot.on::after{background:var(--acc)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <div class="kicker">Work &middot; Shift Report</div>
      <div class="sub" id="hdrDate">&nbsp;</div>
    </div>
    <div class="chip" id="hdrChip">&nbsp;</div>
  </header>
  <div id="bar"><i></i></div>
  <main id="stage"></main>
  <footer>
    <div id="ftInfo"></div>
    <nav id="dots" aria-label="Views"></nav>
  </footer>
</div>

<script>
"use strict";

/* ============================ SETTINGS ============================ */
const CONFIG = {
  // The work OneDrive syncs this file to the local C: drive on the PC running this
  // dashboard (C:\Users\Marck\OneDrive - Fitzroy Group\Work Data\Shift Reports\
  // Dashboard\work_data.json), so no Microsoft sign-in is needed — a small local file
  // server just needs to serve that same folder over localhost. See the setup note
  // below CONFIG. Set dataUrl to that local server's address.
  dataUrl: "http://localhost:8787/work_data.json",
  // Not used while dataUrl is set above — only needed if you switch back to reading
  // the file straight from OneDrive via Microsoft sign-in instead of a local server.
  clientId: "PASTE-YOUR-WORK-APP-CLIENT-ID-HERE",
  authority: "https://login.microsoftonline.com/organizations",
  filePath: "Work Data/Shift Reports/Dashboard/work_data.json",
  viewSeconds: 10,
  timeZone: "Australia/Brisbane"
};
/* ---------------------------------------------------------------------------
   SETUP — serving work_data.json locally (no sign-in needed)
   This page runs in a browser, so it can't read C: directly — it needs the file
   served over HTTP. Since OneDrive already syncs it to disk, the simplest way is
   a tiny local static file server pointed at that folder, left running on the
   touchscreen PC:

     1. Install Python (if not already on the PC): https://www.python.org/downloads/
     2. Open Command Prompt and run:
          cd "C:\Users\Marck\OneDrive - Fitzroy Group\Work Data\Shift Reports\Dashboard"
          python -m http.server 8787
     3. Leave that window running (or set it up as a scheduled task / startup
        shortcut so it starts automatically with Windows).
     4. This page then reads http://localhost:8787/work_data.json, refreshed
        every cycle — no login, no token, no Azure app registration.

   If the browser and the file server are on different machines, replace
   "localhost" above with that PC's IP address or hostname on your network.
--------------------------------------------------------------------------- */
const MSAL_URL = "https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js";

const params = new URLSearchParams(location.search);
const DEMO = params.has("demo");                       // ?demo  -> built-in sample data
if (Number(params.get("seconds")) > 0) CONFIG.viewSeconds = Number(params.get("seconds"));
if (params.get("data")) CONFIG.dataUrl = params.get("data");   // ?data=work_data.json

const DEMO_DATA = {
  reportDate: "2026-10-02", shift: "NS", shiftLabel: "Nightshift",
  reportTime: "2026-10-03T04:00:00.000Z",
  romTonnes: {
    thisShift: { actual: 0, plan: 6115, variance: -5095.83 },
    today:     { actual: 125, plan: 12920, variance: -25715 },
    month:     { actual: 21935, plan: 61225, variance: -39290 }
  },
  units: [
    { unit: "LW04", panel: "MH02", actual: 0, plan: 0, variance: 0, status: "No plan", hasData: true },
    { unit: "CM01", panel: "MG04", actual: 1840, plan: 2100, variance: -260, status: "Behind", hasData: true },
    { unit: "CM02", panel: "MG05", actual: 2350, plan: 2200, variance: 150, status: "Ahead", hasData: true },
    { unit: "CHPP", panel: null, actual: 1120, plan: 1815, variance: -695, status: "Behind", hasData: true },
    { unit: "UNIT 5", panel: null, actual: 0, plan: 0, variance: 0, status: null, hasData: false }
  ],
  devMetres: {
    thisShift: { actual: 18.4, plan: 24, variance: -5.6 },
    today:     { actual: 36.8, plan: 48, variance: -11.2 },
    month:     { actual: 412.6, plan: 396, variance: 16.6 }
  },
  generatedAt: "2026-10-03T09:08:00Z", sourceFile: "(demo data)"
};

/* ============================ HELPERS ============================ */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const isNum = n => typeof n === "number" && isFinite(n);
const fmt = (n, dp) => isNum(n)
  ? n.toLocaleString("en-AU", { minimumFractionDigits: dp, maximumFractionDigits: dp }) : "";
const num = (n, dp, unit) => isNum(n) ? fmt(n, dp) + (unit || "") : '<span class="dim">&ndash;</span>';
function varCell(v, dp, unit) {
  if (!isNum(v)) return '<span class="dim">&ndash;</span>';
  if (v === 0) return '<span class="v0">0' + (unit || "") + "</span>";
  return '<span class="' + (v < 0 ? "neg" : "pos") + '">' + (v < 0 ? "&#9660; " : "&#9650; ") +
    fmt(Math.abs(v), dp) + (unit || "") + "</span>";
}
const pct = (a, p) => (isNum(a) && isNum(p) && p > 0) ? Math.round(a / p * 100) : null;
const pctCell = p => p === null ? '<span class="dim">&ndash;</span>'
  : '<span class="meter"><i style="width:' + Math.min(100, p) + '%"></i></span><span class="pcv">' + p + "%</span>";
function stamp(iso) {
  const d = new Date(iso);
  return isNaN(d) ? "" : d.toLocaleString("en-AU", { timeZone: CONFIG.timeZone, day: "numeric", month: "short",
    hour: "2-digit", minute: "2-digit", hour12: false });
}
function longDate(ymd) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(ymd || "");
  if (!m) return esc(ymd || "");
  return new Date(+m[1], +m[2] - 1, +m[3]).toLocaleDateString("en-AU",
    { weekday: "short", day: "numeric", month: "short", year: "numeric" });
}
const notice = (title, body) => '<div class="notice"><h2>' + title + "</h2>" + body + "</div>";

/* ============================ VIEWS ============================ */
function periodTable(group, unit, dp) {
  const rows = [["This shift", "thisShift"], ["Day to date", "today"], ["Month to date", "month"]];
  const body = rows.map(([label, key]) => {
    const g = (group && group[key]) || {};
    return "<tr><td>" + label + "</td><td>" + num(g.actual, dp, unit) + "</td><td>" + num(g.plan, dp, unit) +
      "</td><td>" + varCell(g.variance, dp, unit) + '</td><td class="pc">' + pctCell(pct(g.actual, g.plan)) + "</td></tr>";
  }).join("");
  return '<table data-max="14"><thead><tr><th>Period</th><th>Actual</th><th>Plan</th><th>Variance</th>' +
    "<th>% of plan</th></tr></thead><tbody>" + body + "</tbody></table>";
}

function renderRom(d) { return periodTable(d.romTonnes, "", 0); }

function renderUnits(d) {
  const units = Array.isArray(d.units) ? d.units : [];
  if (!units.length) return notice("No production units", "<p>work_data.json has no units for this report.</p>");
  const body = units.map(u => {
    const has = u.hasData !== false;
    return '<tr class="' + (has ? "" : "nodata") + '"><td>' + esc(u.unit) + '</td><td class="l">' +
      (u.panel ? esc(u.panel) : '<span class="dim">&ndash;</span>') + "</td><td>" + (has ? num(u.actual, 0, "") : "&ndash;") +
      "</td><td>" + (has ? num(u.plan, 0, "") : "&ndash;") + "</td><td>" + (has ? varCell(u.variance, 0, "") : "&ndash;") +
      '</td><td class="l">' + (has ? esc(u.status || "") : "No data") + "</td></tr>";
  }).join("");
  return '<table data-max="9"><thead><tr><th>Unit</th><th class="l">Panel</th><th>Actual</th><th>Plan</th>' +
    '<th>Variance</th><th class="l">Status</th></tr></thead><tbody>' + body + "</tbody></table>";
}

function renderMetres(d) {
  if (!d.devMetres) {
    return notice("No metres data yet",
      "<p>work_data.json has no <b>devMetres</b> block. Add this to the file written by the flow and this view will fill in:</p>" +
      "<pre>\"devMetres\": {\n  \"thisShift\": { \"actual\": 0, \"plan\": 0, \"variance\": 0 },\n" +
      "  \"today\":     { \"actual\": 0, \"plan\": 0, \"variance\": 0 },\n" +
      "  \"month\":     { \"actual\": 0, \"plan\": 0, \"variance\": 0 }\n}</pre>");
  }
  return periodTable(d.devMetres, " m", 1);
}

const VIEWS = [
  { title: "ROM Tonnes", render: renderRom },
  { title: "Tonnes by Production Unit", render: renderUnits },
  { title: "Development Metres", render: renderMetres }
];

/* ============================ DATA / AUTH ============================ */
let msalApp = null, data = null, lastOk = null, lastError = null, stale = false;
let idx = 0, timer = null;

function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src; s.onload = res; s.onerror = () => rej(new Error("could not load " + src));
    document.head.appendChild(s);
  });
}
async function initAuth() {
  await loadScript(MSAL_URL);
  msalApp = new msal.PublicClientApplication({
    auth: { clientId: CONFIG.clientId, authority: CONFIG.authority,
            redirectUri: location.origin + location.pathname },
    cache: { cacheLocation: "localStorage" }
  });
  if (msalApp.initialize) await msalApp.initialize();
}
async function getToken(interactive) {
  if (!msalApp) throw new Error("Microsoft sign-in is not loaded - check the internet connection");
  const scopes = ["Files.Read"];
  const acct = msalApp.getAllAccounts()[0];
  const needSignIn = () => { const e = new Error("Sign-in needed"); e.code = "signin"; return e; };
  if (!acct) {
    if (!interactive) throw needSignIn();
    return (await msalApp.loginPopup({ scopes })).accessToken;
  }
  try {
    return (await msalApp.acquireTokenSilent({ scopes, account: acct })).accessToken;
  } catch (e) {
    if (!interactive) throw needSignIn();
    return (await msalApp.acquireTokenPopup({ scopes, account: acct })).accessToken;
  }
}
async function timedFetch(url, opts, ms) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms || 8000);
  try { return await fetch(url, Object.assign({ cache: "no-store", signal: ctl.signal }, opts || {})); }
  finally { clearTimeout(t); }
}
async function loadData() {
  if (DEMO) return DEMO_DATA;
  if (CONFIG.dataUrl) {
    const r = await timedFetch(CONFIG.dataUrl + (CONFIG.dataUrl.indexOf("?") < 0 ? "?" : "&") + "t=" + Date.now());
    if (!r.ok) throw new Error("File request failed (" + r.status + ")");
    return r.json();
  }
  const token = await getToken(false);
  const path = CONFIG.filePath.split("/").map(encodeURIComponent).join("/");
  const r = await timedFetch("https://graph.microsoft.com/v1.0/me/drive/root:/" + path + ":/content",
    { headers: { Authorization: "Bearer " + token } });
  if (!r.ok) throw new Error("OneDrive request failed (" + r.status + ")");
  return r.json();
}
async function refresh() {
  try {
    let d = await loadData();
    if (Array.isArray(d)) d = d[d.length - 1];
    if (!d || typeof d !== "object") throw new Error("work_data.json is empty or not an object");
    data = d; lastOk = new Date(); stale = false; lastError = null;
  } catch (e) {
    stale = !!data; lastError = e;
  }
}

/* ============================ SCREEN ============================ */
const stage = $("stage");

function errorPanel() {
  const e = lastError || new Error("No data yet");
  if (e.code === "signin") {
    return notice("Sign in to load shift data",
      '<p>Tap to sign in with your work account.</p><button class="act" data-signin>Sign in</button>');
  }
  return notice("Shift data not available", "<p>" + esc(e.message) + "</p><p>Trying again on the next cycle.</p>");
}

function fitTables() {
  const card = stage.querySelector(".card"), t = card && card.querySelector("table[data-max]");
  if (!t) return;
  const u = Math.min(innerWidth * 0.01, innerHeight * 0.016);
  const h1 = stage.querySelector("h1"), cs = getComputedStyle(stage), hs = getComputedStyle(h1);
  const room = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom)
    - h1.offsetHeight - parseFloat(hs.marginBottom);
  const n = t.tBodies[0].rows.length || 1;
  const rowh = Math.max(34, Math.min((room - t.tHead.offsetHeight - 4) / n, Number(t.dataset.max) * u));
  t.style.setProperty("--rowh", rowh + "px");
  t.style.fontSize = Math.min(2.4 * u, rowh * 0.46) + "px";
}

function renderChrome() {
  if (data) {
    $("hdrDate").textContent = longDate(data.reportDate);
    $("hdrChip").textContent = [data.shift, data.shiftLabel].filter(Boolean).join(" · ");
  }
  $("dots").innerHTML = VIEWS.map((v, i) =>
    '<button class="dot' + (i === idx ? " on" : "") + '" data-i="' + i + '" aria-label="' + esc(v.title) +
    '"' + (i === idx ? ' aria-current="true"' : "") + "></button>").join("");
  const bits = [];
  if (DEMO) bits.push('<span class="warn">DEMO DATA</span>');
  if (data && data.reportTime) bits.push("Signed off " + stamp(data.reportTime));
  if (data && data.generatedAt) bits.push("Data updated " + stamp(data.generatedAt));
  if (data && data.sourceFile) bits.push("Source: " + esc(data.sourceFile));
  if (stale && lastError) bits.push('<span class="warn">Could not refresh (' + esc(lastError.message) + ") – showing last good data</span>");
  $("ftInfo").innerHTML = bits.join(" &nbsp;&middot;&nbsp; ");
}

function render() {
  const v = VIEWS[idx];
  stage.innerHTML = "<h1>" + v.title + '</h1><div class="card">' + (data ? v.render(data) : errorPanel()) + "</div>";
  stage.classList.remove("in"); void stage.offsetWidth; stage.classList.add("in");
  renderChrome();
  fitTables();
}

function restartBar() {
  const bar = $("bar");
  bar.classList.remove("run"); void bar.offsetWidth;
  bar.style.setProperty("--dur", CONFIG.viewSeconds + "s");
  bar.classList.add("run");
}
function schedule() {
  clearTimeout(timer);
  restartBar();
  timer = setTimeout(advance, CONFIG.viewSeconds * 1000);
}
async function advance() {          // every CONFIG.viewSeconds: re-read the file, then show the next view
  idx = (idx + 1) % VIEWS.length;
  await refresh();
  render();
  schedule();
}
function jump(i) { idx = i; render(); schedule(); }

async function signIn() {
  try { await getToken(true); await refresh(); render(); schedule(); }
  catch (e) { lastError = e; render(); schedule(); }
}

$("dots").addEventListener("click", e => {
  const b = e.target.closest(".dot"); if (b) jump(Number(b.dataset.i));
});
stage.addEventListener("click", e => { if (e.target.closest("[data-signin]")) signIn(); });
window.addEventListener("resize", fitTables);

(async function start() {
  if (!DEMO && !CONFIG.dataUrl) {
    try { await initAuth(); }
    catch (e) { lastError = new Error("Microsoft sign-in could not load (" + e.message + ")"); }
  }
  await refresh();
  render();
  schedule();
})();
</script>
</body>
</html>
